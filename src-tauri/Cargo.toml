[package]
name = "notepad-os"
version = "0.3.0"
description = "A private offline workspace for your notes. Part of the Notepad OS local productivity environment."
authors = ["Notepad OS Developers"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-fs = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-process = "2.0"
tauri-plugin-updater = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# This feature is used for production builds or when `tauri build` runs
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
